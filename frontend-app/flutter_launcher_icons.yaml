flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Trading-dest.png"
  min_sdk_android: 23
  # Adaptive icon (Android 8+): icon on the dark brand surface.
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: "Trading-dest.png"
  # iOS icons must not have an alpha channel.
  remove_alpha_ios: true
